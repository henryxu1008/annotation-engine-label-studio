name: Classification Gold V1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: classification-gold-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

env:
  TEST_ENVIRONMENT: "1"
  SENTRY_DSN: ""
  POETRY_VERSION: 2.3.2
  DJANGO_SETTINGS_MODULE: core.settings.label_studio
  DJANGO_DB: postgresql
  POSTGRE_HOST: localhost
  POSTGRE_PORT: "5432"
  POSTGRE_NAME: classification_gold
  POSTGRE_USER: postgres
  POSTGRE_PASSWORD: gold-ci-synthetic-only
  APPROVED_EXPORT_ROOT: /tmp/gold82-ci-private
  LABEL_STUDIO_BASE_DATA_DIR: /tmp/gold82-ci-data
  DEBUG: "true"
  HOSTNAME: http://localhost:8080
  FRONTEND_HOSTNAME: http://localhost:8080
  FRONTEND_HMR: "false"
  COLLECT_ANALYTICS: "false"
  LATEST_VERSION_CHECK: "false"
  SENTRY_RATE: "0"
  JSON_LOG: "0"

jobs:
  classification-gold:
    name: PostgreSQL and bilingual gold browser journeys
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: gold-ci-synthetic-only
          POSTGRES_DB: classification_gold
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d classification_gold"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: poetry
      - name: Install backend OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext fontconfig fonts-noto-cjk libffi8 libldap2-dev libsasl2-dev libssl-dev libxml2-dev libxslt-dev python3-dev
          test -n "$(fc-list :lang=zh-cn family)"
      - name: Install backend dependencies
        run: poetry install --with test
      - name: Test gold and classification regressions
        working-directory: label_studio
        run: |
          poetry run python core/version.py
          poetry run pytest -q classification_disagreements/tests/test_gold_api.py classification_disagreements/tests/test_gold_scoring.py classification_disagreements/tests/test_comparison.py
      - name: Test isolated score worker process
        working-directory: label_studio
        env:
          LS82_TEST_REDIS_URL: redis://localhost:6379/0
        run: poetry run pytest -q classification_disagreements/tests/test_blind_quality_boundary.py::TestBlindScoreWorkerProcess
      - name: Prepare synthetic database
        run: |
          poetry run python label_studio/core/version.py
          poetry run python label_studio/manage.py compilemessages -l en_US -l zh_Hans
          poetry run python label_studio/manage.py migrate --noinput
          poetry run python label_studio/manage.py collectstatic --noinput
          poetry run python label_studio/manage.py seed_classification_e2e
          LS82_SYNTHETIC_BLIND_FIXTURE=1 poetry run python label_studio/manage.py seed_classification_blind_e2e \
            --source web/apps/labelstudio-e2e/.classification81-e2e.json \
            --output web/apps/labelstudio-e2e/.classification82-blind-e2e.json
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: web/yarn.lock
      - name: Install and test frontend
        working-directory: web
        run: |
          yarn install --frozen-lockfile
          NX_DAEMON=false yarn jest --config apps/labelstudio/jest.config.ts --runInBand --runTestsByPath \
            apps/labelstudio/src/pages/DataManager/ClassificationGold.test.jsx \
            apps/labelstudio/src/pages/DataManager/MyWorkWorkspace.test.jsx
          NX_DAEMON=false yarn jest --config libs/datamanager/jest.config.ts --runInBand --runTestsByPath \
            libs/datamanager/src/sdk/blind-protocol.test.js \
            libs/datamanager/src/utils/api-proxy/blind-guard.test.js \
            libs/datamanager/src/components/Common/Form/Form.blind.test.jsx \
            libs/datamanager/src/components/App/App.blind.test.jsx \
            libs/datamanager/src/components/Label/Label.blind.test.jsx \
            libs/datamanager/src/stores/AppStore.setTask.test.js \
            libs/datamanager/src/stores/DataStores/tasks.queue.test.js \
            libs/datamanager/src/stores/AppStore.fetchUsers.test.js \
            libs/datamanager/src/sdk/dm-sdk.locale.test.js \
            libs/datamanager/src/sdk/lsf-sdk.locale.test.jsx \
            libs/datamanager/src/sdk/app-create.test.jsx
          yarn i18n:catalogs
          yarn i18n:literals
          yarn ls:build
      - name: Start isolated server
        run: |
          export ANNOTATION_CLASSIFICATION_GOLD_ENABLED=true
          export ANNOTATION_CLASSIFICATION_GOLD_PROJECTS="$(python -c 'import json; print(json.dumps({k: True for k in json.load(open("web/apps/labelstudio-e2e/.classification81-e2e.json"))["modes"]}))')"
          export ANNOTATION_CLASSIFICATION_BLIND_ENABLED=true
          export ANNOTATION_CLASSIFICATION_BLIND_PROJECTS="$ANNOTATION_CLASSIFICATION_GOLD_PROJECTS"
          nohup poetry run python label_studio/manage.py runserver 127.0.0.1:8080 --noreload > /tmp/classification-gold.log 2>&1 &
          echo $! > /tmp/classification-gold.pid
          for i in {1..90}; do
            if curl --fail --silent http://localhost:8080/health/ >/dev/null \
              && curl --fail --silent http://localhost:8080/react-app/main.js >/dev/null; then exit 0; fi
            sleep 2
          done
          tail -200 /tmp/classification-gold.log
          exit 1
      - name: Run bilingual browser journeys
        working-directory: web
        run: |
          yarn cypress run --project apps/labelstudio-e2e --config-file cypress.config.ts --browser chrome \
            --config baseUrl=http://localhost:8080,video=true \
            --spec 'apps/labelstudio-e2e/src/e2e/classification-gold.cy.ts,apps/labelstudio-e2e/src/e2e/classification-blind-privacy.cy.ts,apps/labelstudio-e2e/src/e2e/classification-blind-editor.cy.ts,apps/labelstudio-e2e/src/e2e/classification-blind-mixed.cy.ts,apps/labelstudio-e2e/src/e2e/classification-blind-draft-revocation.cy.ts'
      - name: Stop owned server
        if: always()
        run: |
          if test -f /tmp/classification-gold.pid; then kill "$(cat /tmp/classification-gold.pid)" || true; fi
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: classification-gold-e2e
          if-no-files-found: ignore
          path: |
            web/dist/cypress/apps/labelstudio-e2e/screenshots/**
            web/dist/cypress/apps/labelstudio-e2e/videos/**
            /tmp/classification-gold.log
