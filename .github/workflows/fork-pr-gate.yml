name: Fork PR Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
    # Required checks must run for every PR, including documentation-only changes.

permissions:
  contents: read

concurrency:
  group: fork-pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: 2.3.2
  DJANGO_SETTINGS_MODULE: core.settings.label_studio
  DJANGO_DB: sqlite
  LOG_DIR: pytest_logs
  COLLECT_ANALYTICS: "false"
  SENTRY_RATE: "0"
  JSON_LOG: "0"

jobs:
  authorization-tests:
    name: Authorization foundation tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      session-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: session-security-test-only
          POSTGRES_DB: session_security
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout PR merge commit or pushed main commit
        uses: actions/checkout@v6

      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: poetry

      - name: Verify isolated candidate build and archive contracts
        run: python -m unittest discover -s scripts -p 'test_candidate_*.py' -v

      - name: Install OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi8 libldap2-dev libsasl2-dev libssl-dev libxml2-dev libxslt-dev python3-dev

      - name: Install Python dependencies
        run: poetry install --with test

      - name: Generate version file
        run: poetry run python label_studio/core/version.py

      - name: Check migrations are in sync
        run: |
          poetry run python label_studio/manage.py makemigrations --check --dry-run

      - name: Run authorization regression tests
        working-directory: label_studio
        run: |
          poetry run pytest -v \
            users/tests/test_session_revocation.py \
            users/tests/test_session_contract.py \
            users/tests/test_session_workers.py \
            users/tests/test_session_version_migration.py \
            session_policy/tests/test_session_policy.py \
            access_control/tests/test_identity.py \
            tasks/tests/test_annotation_actor_security.py \
            projects/tests/test_project_authorization.py \
            projects/tests/test_project_member_management.py \
            projects/tests/test_project_write_surface_hardening.py \
            tasks/tests/test_task_assignment_authorization.py \
            tasks/tests/test_project_operation_policy.py \
            tasks/tests/test_my_work.py \
            review_batches/tests/test_batches.py classification_disagreements/tests/test_comparison.py classification_disagreements/tests/test_batches.py classification_disagreements/tests/test_arbitration.py \
            task_packages/tests \
            tasks/tests/test_enterprise_collaboration_acceptance.py \
            tasks/tests/test_submission_review_workflow.py \
            organizations/tests/test_api.py::TestOrganizationInviteLoggingAPI

      - name: Run annotation/task API smoke tests
        working-directory: label_studio
        run: poetry run pytest -v tasks/tests/test_api.py -m "not integration_tests"

      - name: Run PostgreSQL session and submission regressions
        working-directory: label_studio
        env:
          DJANGO_DB: postgresql
          POSTGRE_HOST: localhost
          POSTGRE_NAME: session_security
          POSTGRE_USER: postgres
          POSTGRE_PASSWORD: session-security-test-only
        run: |
          poetry run pytest -q \
            users/tests/test_session_contract.py users/tests/test_session_revocation.py users/tests/test_session_version_migration.py \
            tasks/tests/test_submission_review_workflow.py tasks/tests/test_enterprise_collaboration_acceptance.py \
            tasks/tests/test_task_assignment_authorization.py
          poetry run pytest -q \
            tasks/tests/test_project_write_concurrency.py \
            review_batches/tests classification_disagreements/tests \
            task_packages/tests \
            tasks/tests/test_project_operation_policy.py tasks/tests/test_my_work.py

      - name: Run request locale and translated template regressions
        working-directory: label_studio
        run: poetry run pytest -q users/tests/test_locale.py users/tests/test_locale_templates.py users/tests/test_locale_migration.py

      - name: Reject missing or unsafe failure artifacts
        run: poetry run python -m unittest discover -s scripts -p test_i18n_failure_artifact_audit.py
