name: Feature Flags Boundary

on:
  push:
    paths:
      - .github/workflows/feature-flags-update.yml
      - .github/workflows/feature-flags-boundary.yml
      - .github/workflows/ff-command.yml
      - .github/workflows/release-cut-off-release-branch.yml
      - scripts/test_feature_flags_workflow.py
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/feature-flags-update.yml
      - .github/workflows/feature-flags-boundary.yml
      - .github/workflows/ff-command.yml
      - .github/workflows/release-cut-off-release-branch.yml
      - scripts/test_feature_flags_workflow.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Feature flags entry contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.3
      - name: Verify workflow boundary contracts
        run: python -m unittest discover -s scripts -p 'test_feature_flags_workflow.py' -v

  # Never run an upstream sync as a test. No third-party secrets are forwarded.
  # The local reusable reference selects the same commit as this caller.
  fork-reusable-skip:
    name: Fork reusable skip probe
    needs: contracts
    if: ${{ github.repository == 'qq550723504/annotation-engine-label-studio' }}
    permissions: {}
    uses: ./.github/workflows/feature-flags-update.yml
    with:
      ref: HumanSignal/label-studio
