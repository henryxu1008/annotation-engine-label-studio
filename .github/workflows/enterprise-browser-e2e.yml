name: Enterprise Browser E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, edited]
    # Required checks run for every PR, including documentation-only changes.
  workflow_dispatch:
    inputs:
      dependency_cache:
        description: Project dependency cache mode for bounded CI acceptance
        type: choice
        required: true
        default: warm
        options: [warm, cold]

permissions:
  contents: read

concurrency:
  group: enterprise-browser-e2e-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

env:
  POETRY_VERSION: 2.3.2
  DJANGO_SETTINGS_MODULE: core.settings.label_studio
  DJANGO_DB: postgresql
  POSTGRE_HOST: localhost
  POSTGRE_PORT: "5432"
  POSTGRE_NAME: ui_ci_browser
  POSTGRE_USER: postgres
  POSTGRE_PASSWORD: browser-e2e-test-only
  TEST_ENVIRONMENT: "1"
  DEBUG: "true"
  HOSTNAME: "http://localhost:8080"
  COLLECT_ANALYTICS: "false"
  SENTRY_RATE: "0"
  JSON_LOG: "0"
  FRONTEND_HMR: "false"
  FRONTEND_HOSTNAME: "http://localhost:8080"
  NX_DAEMON: "false"
  NX_NO_CLOUD: "true"
  NX_SKIP_NX_CACHE: "true"
  NX_SKIP_REMOTE_CACHE: "true"
  PYTHONDONTWRITEBYTECODE: "1"
  UI_DEPENDENCY_CACHE: ${{ github.event_name == 'workflow_dispatch' && inputs.dependency_cache || 'warm' }}

jobs:
  prepare-ui:
    name: Prepare enterprise UI
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      build-id: ${{ steps.build.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure project dependency cache mode
        run: python scripts/ci/ui.py dependencies
      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: ${{ env.UI_DEPENDENCY_CACHE == 'warm' && 'poetry' || '' }}
      - name: Install backend OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext libffi8 libldap2-dev libsasl2-dev libssl-dev libxml2-dev libxslt-dev python3-dev
      - name: Install backend dependencies and generate version
        run: |
          poetry install --with test
          poetry run python label_studio/core/version.py
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: ${{ env.UI_DEPENDENCY_CACHE == 'warm' && 'yarn' || '' }}
          cache-dependency-path: web/yarn.lock
      - name: Install frontend dependencies
        working-directory: web
        run: yarn install --frozen-lockfile
      - name: Validate CI evidence contracts
        run: |
          poetry run python -m unittest discover -s scripts/ci/tests -v
          node --test scripts/ci/tests/run_cypress.test.cjs
      - name: Run original frontend contracts and production build
        id: prepare
        run: poetry run python scripts/ci/ui.py prepare --out "$RUNNER_TEMP/ui-prepare-evidence"
      - name: Upload immutable frontend build
        id: build
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.prepare.outputs.build-name }}
          path: ${{ runner.temp }}/ui-prepare-evidence-build/
          if-no-files-found: error
      - name: Retain bounded prepare evidence
        if: ${{ always() && steps.prepare.outputs.artifact-name != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.prepare.outputs.artifact-name }}
          path: ${{ runner.temp }}/ui-prepare-evidence-export/
          if-no-files-found: error

  browser:
    name: Enterprise UI / ${{ matrix.shard }}
    needs: prepare-ui
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      POSTGRE_HOST: "127.0.0.1"
      POSTGRE_NAME: ${{ matrix.shard == 'review-audit' && 'ui_ci_second_review_audit_browser' || matrix.shard == 'second-review' && 'ui_ci_second_review_browser' || 'ui_ci_browser' }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        shard:
          - review-classification
          - enterprise-ui
          - locale-a
          - locale-b
          - locale-c
          - full-en
          - full-zh
          - packages-import
          - confidence
          - second-review
          - review-audit
    services:
      browser-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: browser-e2e-test-only
          POSTGRES_DB: ${{ matrix.shard == 'review-audit' && 'ui_ci_second_review_audit_browser' || matrix.shard == 'second-review' && 'ui_ci_second_review_browser' || 'ui_ci_browser' }}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Configure project dependency cache mode
        run: python scripts/ci/ui.py dependencies
      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: ${{ env.UI_DEPENDENCY_CACHE == 'warm' && 'poetry' || '' }}
      - name: Install backend OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext libffi8 libldap2-dev libsasl2-dev libssl-dev libxml2-dev libxslt-dev python3-dev
      - name: Install backend dependencies and generate version
        run: |
          poetry install --with test
          poetry run python label_studio/core/version.py
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: ${{ env.UI_DEPENDENCY_CACHE == 'warm' && 'yarn' || '' }}
          cache-dependency-path: web/yarn.lock
      - name: Install frontend dependencies
        working-directory: web
        run: yarn install --frozen-lockfile
      - name: Download exact prepare artifact ID into a private directory
        uses: actions/download-artifact@v6
        with:
          artifact-ids: ${{ needs.prepare-ui.outputs.build-id }}
          merge-multiple: true
          path: ${{ runner.temp }}/ui-build
      - name: Verify and install bounded frontend archive
        run: poetry run python scripts/ci/ui.py unpack --package "$RUNNER_TEMP/ui-build"
      - name: Run isolated original browser journeys
        id: journeys
        env:
          UI_BUILD_ID: ${{ needs.prepare-ui.outputs.build-id }}
          UI_SHARD: ${{ matrix.shard }}
        run: |
          unset ENTERPRISE_E2E_CONTAINER
          poetry run python scripts/ci/ui.py browser --shard "$UI_SHARD" --out "$RUNNER_TEMP/ui-browser-evidence" --package "$RUNNER_TEMP/ui-build" --build-artifact-id "$UI_BUILD_ID"
      - name: Retain bounded browser evidence
        if: ${{ always() && steps.journeys.outputs.artifact-name != '' }}
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.journeys.outputs.artifact-name }}
          path: ${{ runner.temp }}/ui-browser-evidence-export/
          if-no-files-found: error

  current-ui-validation:
    # The unique required check name and GitHub Actions app binding stay unchanged.
    name: Current enterprise UI validation
    needs: [prepare-ui, browser]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify every latest execution and immutable evidence artifact
        id: aggregate
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/ci/ui.py aggregate --out "$RUNNER_TEMP/ui-aggregate"
      - name: Retain aggregate execution map
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: enterprise-ui-${{ github.run_id }}-a${{ github.run_attempt }}-aggregate
          path: ${{ runner.temp }}/ui-aggregate/result.json
          if-no-files-found: error
