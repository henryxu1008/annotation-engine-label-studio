name: Enterprise Browser E2E

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - edited
    # Required checks must run for every PR, including documentation-only changes.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: enterprise-browser-e2e-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref) || github.run_id }}
  cancel-in-progress: true

env:
  POETRY_VERSION: 2.3.2
  DJANGO_SETTINGS_MODULE: core.settings.label_studio
  # Browser journeys exercise concurrent HTTP/session/import writes on the
  # candidate's database backend. SQLite foundation coverage stays in Fork PR Gate.
  DJANGO_DB: postgresql
  POSTGRE_HOST: localhost
  POSTGRE_PORT: "5432"
  POSTGRE_NAME: label_studio_browser
  POSTGRE_USER: postgres
  POSTGRE_PASSWORD: browser-e2e-test-only
  DEBUG: "true"
  HOSTNAME: "http://localhost:8080"
  COLLECT_ANALYTICS: "false"
  SENTRY_RATE: "0"
  JSON_LOG: "0"
  FRONTEND_HMR: "false"
  FRONTEND_HOSTNAME: "http://localhost:8080"

jobs:
  current-ui-validation:
    name: Current enterprise UI validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      browser-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: browser-e2e-test-only
          POSTGRES_DB: label_studio_browser
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d label_studio_browser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - name: Checkout PR merge commit, pushed main commit or dispatch ref
        uses: actions/checkout@v6

      - name: Install Poetry
        run: pipx install "poetry==${{ env.POETRY_VERSION }}"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: poetry

      - name: Install backend OS dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext libffi8 libldap2-dev libsasl2-dev libssl-dev libxml2-dev libxslt-dev python3-dev

      - name: Install backend dependencies
        run: poetry install --with test

      - name: Generate version file
        run: poetry run python label_studio/core/version.py

      - name: Migrate, collect static files, and seed enterprise E2E data
        run: |
          poetry run python label_studio/manage.py compilemessages -l en_US -l zh_Hans
          poetry run python label_studio/manage.py migrate --noinput
          poetry run python label_studio/manage.py collectstatic --noinput
          poetry run python label_studio/manage.py seed_enterprise_e2e

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: yarn
          cache-dependency-path: web/yarn.lock

      - name: Install frontend dependencies
        working-directory: web
        run: yarn install --frozen-lockfile

      - name: Validate catalogs and localized frontend contracts
        working-directory: web
        run: |
          yarn i18n:catalogs
          yarn i18n:literals
          node --test apps/labelstudio-e2e/src/support/failure-diagnostics.test.cjs
          yarn nx run i18n:unit
          yarn ls:unit
          yarn nx run app-common:unit
          yarn jest --config libs/ui/jest.config.ts --runInBand --runTestsByPath \
            libs/ui/src/lib/dropdown/dropdown.test.tsx \
            libs/ui/src/lib/dropdown/dropdown-transition.test.tsx \
            libs/ui/src/lib/toast/toast.test.tsx
          yarn dm:unit
          yarn lsf:unit

      - name: Build frontend
        working-directory: web
        run: yarn ls:build

      - name: Start Django
        run: |
          nohup poetry run python label_studio/manage.py runserver 0.0.0.0:8080 > /tmp/label-studio-django.log 2>&1 &
          echo $! > /tmp/label-studio-django.pid

      - name: Wait for application
        run: |
          for i in {1..90}; do
            if curl --fail --silent http://localhost:8080/health/ >/dev/null \
              && curl --fail --silent http://localhost:8080/react-app/runtime.js >/dev/null \
              && curl --fail --silent http://localhost:8080/react-app/vendor.js >/dev/null \
              && curl --fail --silent http://localhost:8080/react-app/main.js >/dev/null; then
              echo "Django and same-origin React bundles are ready."
              exit 0
            fi
            sleep 2
          done
          echo "Django log:"
          tail -200 /tmp/label-studio-django.log || true
          echo "Built React assets:"
          ls -la web/dist/apps/labelstudio || true
          exit 1

      - name: Run existing enterprise UI Cypress specs
        working-directory: web
        run: |
          yarn cypress run \
            --project apps/labelstudio-e2e \
            --config-file cypress.config.ts \
            --config baseUrl=http://localhost:8080,video=true \
            --env loginLocale=en-US \
            --spec "apps/labelstudio-e2e/src/e2e/enterprise-current-ui.cy.ts,apps/labelstudio-e2e/src/e2e/project-members.cy.ts,apps/labelstudio-e2e/src/e2e/task-assignments.cy.ts,apps/labelstudio-e2e/src/e2e/reviewer-workspace.cy.ts,apps/labelstudio-e2e/src/e2e/submission-release.cy.ts"

      - name: Run isolated locale component journeys
        run: |
          for spec in auth-tips-timeout app-locale dm-editor-locale dm-task-switch dm-keyboard-ime dm-entity-draft annotator-label-stream dm-export-locale collaboration-locale; do
            poetry run python label_studio/manage.py seed_enterprise_e2e
            (cd web && yarn cypress run \
              --project apps/labelstudio-e2e \
              --config-file cypress.config.ts \
              --config baseUrl=http://localhost:8080,video=true \
              --spec "apps/labelstudio-e2e/src/e2e/${spec}.cy.ts")
          done

      - name: Run full collaboration workflow in each language
        run: |
          for locale in en-US zh-CN; do
            poetry run python label_studio/manage.py seed_enterprise_e2e
            (cd web && yarn cypress run \
              --project apps/labelstudio-e2e \
              --config-file cypress.config.ts \
              --config baseUrl=http://localhost:8080,video=true \
              --env "fullFlowLocale=${locale}" \
              --spec apps/labelstudio-e2e/src/e2e/full-enterprise-workflow.cy.ts)
          done

      - name: Run delayed project import regression
        run: |
          poetry run python label_studio/manage.py seed_enterprise_e2e
          (cd web && yarn cypress run \
            --project apps/labelstudio-e2e \
            --config-file cypress.config.ts \
            --config baseUrl=http://localhost:8080,video=true \
            --spec apps/labelstudio-e2e/src/e2e/import-initialization.cy.ts)

      - name: Print server logs on browser failure
        if: failure()
        run: |
          echo "===== Django log ====="
          tail -200 /tmp/label-studio-django.log || true
          echo "===== Built React assets ====="
          ls -la web/dist/apps/labelstudio || true

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: enterprise-browser-e2e-artifacts
          if-no-files-found: ignore
          path: |
            web/dist/cypress/apps/labelstudio-e2e/screenshots/**
            web/dist/cypress/apps/labelstudio-e2e/videos/**
            /tmp/label-studio-django.log
            web/dist/apps/labelstudio/**
