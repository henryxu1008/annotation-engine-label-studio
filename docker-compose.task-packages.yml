# Explicit opt-in; set all five flags to true only after old API and worker
# processes are upgraded and drained. This file does not start a worker.
services:
  app:
    environment:
      ANNOTATION_FIXED_PACKAGES_ENABLED: ${ANNOTATION_FIXED_PACKAGES_ENABLED:-false}
      ANNOTATION_PACKAGE_CLAIM_ENABLED: ${ANNOTATION_PACKAGE_CLAIM_ENABLED:-false}
      ANNOTATION_PACKAGE_DISPATCH_ENABLED: ${ANNOTATION_PACKAGE_DISPATCH_ENABLED:-false}
      ANNOTATION_PACKAGE_ADVANCED_ENABLED: ${ANNOTATION_PACKAGE_ADVANCED_ENABLED:-false}
      ANNOTATION_PACKAGE_AUTOMATION_ENABLED: ${ANNOTATION_PACKAGE_AUTOMATION_ENABLED:-false}
